[project]
name = "inferracad-agenticcad-edit"
version = "0.1.0"
description = "Apple Silicon reproduction of AgenticCADedit with bounded API comparisons"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cadquery==2.6.1",
  "mcp>=1.26,<2",
  "trimesh>=4.12,<5",
  "httpx>=0.28,<1",
  "mongita==1.2.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=18",
  "pillow>=11",
  "matplotlib>=3.9",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "open3d==0.19.0",
  "probreg==0.3.8",
  "opencv-python>=4.10",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.57.1",
  "decord2==3.4.0",
  "openai>=2,<3",
  "anthropic>=0.70,<1",
  "google-genai>=1,<2",
  "json-repair>=0.50",
  "imageio-ffmpeg>=0.6",
  "itables>=2",
  "jupyterlab>=4,<5",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
